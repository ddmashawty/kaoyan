name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check
      - name: Pytest
        run: pytest -q
      - name: Build kaoyan DB from tracked sources
        run: |
          python scripts/seed_kaoyan.py --db "$RUNNER_TEMP/kaoyan.db" > /dev/null
          python scripts/extract_kaoyan.py --db "$RUNNER_TEMP/kaoyan.db" > /dev/null
      - name: Eval L0-L2 against baseline
        run: python scripts/eval_kaoyan.py --layers L0,L1,L2 --db "$RUNNER_TEMP/kaoyan.db" --build-index "$RUNNER_TEMP/kaoyan_bm25" --baseline docs/eval/baseline.json --max-drop 0.02
